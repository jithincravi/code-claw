[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw"
version = "0.1.0"
description = "Personal AI assistant controllable via iMessage or WhatsApp"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "twilio>=8.0.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "flake8>=6.0",
]

[project.scripts]
openclaw = "openclaw.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openclaw*"]
